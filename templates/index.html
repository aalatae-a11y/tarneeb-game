<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طرنيب ليبي أونلاين</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0b1e14; color: #fff; min-height: 100vh; overflow-x: hidden; }

        /* شاشة الدخول */
        #login-box { display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .login-card { background: #1b3b2b; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: center; width: 100%; max-width: 380px; border: 1px solid #27ae60; }
        .login-card h2 { margin-bottom: 20px; color: #f1c40f; font-size: 22px; }
        input, .login-btn { padding: 14px; font-size: 16px; margin: 10px 0; border-radius: 8px; border: none; width: 100%; outline: none; }
        input { background: #0f241a; color: #fff; border: 1px solid #27ae60; text-align: center; }
        .login-btn { background: #e67e22; color: white; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(230,126,34,0.4); }
        .login-btn:hover { background: #d35400; }

        /* شاشة اللعبة الرئيسية */
        #game-board { display: none; width: 100%; min-height: 100vh; background: #0d4a2b; flex-direction: column; justify-content: space-between; padding: 10px; }

        /* الشريط العُلوي */
        .top-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 10px; gap: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .room-title { font-size: 14px; font-weight: bold; color: #f1c40f; }
        #start-btn { padding: 8px 16px; font-size: 13px; background: #e67e22; color: #fff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }

        /* لوحة النتائج */
        .scoreboard { display: flex; gap: 8px; overflow-x: auto; padding: 6px 0; width: 100%; }
        .score-item { background: rgba(0,0,0,0.6); border: 1px solid #f1c40f; border-radius: 6px; padding: 6px 12px; font-size: 11px; white-space: nowrap; color: #f1c40f; font-weight: bold; }
        .score-item span { color: #fff; }

        /* الطاولة الخضراء */
        .table-container { display: flex; justify-content: center; align-items: center; margin: 10px 0; flex: 1; }
        .table-area { position: relative; width: 320px; height: 210px; border: 8px solid #5c3a21; border-radius: 100px; background: #136938; box-shadow: inset 0 0 30px rgba(0,0,0,0.9), 0 8px 20px rgba(0,0,0,0.6); }
        
        /* أماكن اللاعبين حول الطاولة */
        .player-slot { position: absolute; padding: 5px 10px; background: rgba(0,0,0,0.85); border-radius: 8px; font-size: 11px; min-width: 90px; text-align: center; z-index: 5; border: 1px solid rgba(255,255,255,0.15); box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .p-0 { bottom: 6px; left: 50%; transform: translateX(-50%); border: 2px solid #f1c40f; background: rgba(20,50,30,0.95); }
        .p-1 { left: 8px; top: 50%; transform: translateY(-50%); }
        .p-2 { top: 6px; left: 50%; transform: translateX(-50%); }
        .p-3 { right: 8px; top: 50%; transform: translateY(-50%); }
        .active-turn { box-shadow: 0 0 15px #f1c40f; border-color: #f1c40f; background: rgba(39, 174, 96, 0.95) !important; }

        /* ظهر الكروت للاعبين الآخرين */
        .cards-back-container { display: flex; gap: 1px; margin-top: 3px; justify-content: center; }
        .card-back { width: 6px; height: 11px; background: linear-gradient(135deg, #c0392b, #87261d); border: 1px solid #fff; border-radius: 2px; }
        .cards-back-vertical { display: flex; flex-direction: column; gap: 1px; position: absolute; }
        .p-1 .cards-back-vertical { right: -16px; top: 0; }
        .p-3 .cards-back-vertical { left: -16px; top: 0; }

        /* وسط الطاولة (الأكلات المطروحة) */
        .trick-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 140px; height: 80px; z-index: 10; }
        
        /* شكل الكروت */
        .card, .played-card {
            background: #ffffff;
            color: #2c3e50;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-weight: bold;
            user-select: none;
            border: 1px solid #dcdde1;
        }

        .played-card { position: absolute; width: 42px; height: 62px; font-size: 12px; }
        .card { width: 48px; height: 70px; font-size: 13px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; flex-shrink: 0; }
        .card:hover { transform: translateY(-10px); box-shadow: 0 8px 15px rgba(0,0,0,0.6); }

        .card.red, .played-card.red { color: #c0392b; }
        .card.black, .played-card.black { color: #2c3e50; }

        .card-pos-0 { bottom: 0; left: 50%; transform: translateX(-50%); }
        .card-pos-1 { left: 0; top: 50%; transform: translateY(-50%); }
        .card-pos-2 { top: 0; left: 50%; transform: translateX(-50%); }
        .card-pos-3 { right: 0; top: 50%; transform: translateY(-50%); }

        .trick-winner-badge { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); background: #f1c40f; color: #000; font-weight: bold; padding: 4px 10px; border-radius: 6px; font-size: 11px; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index: 25; }

        /* منطقة أوراق يدي في الأسفل */
        .hand-container { background: rgba(0,0,0,0.85); padding: 12px; border-radius: 12px; box-shadow: 0 -5px 20px rgba(0,0,0,0.6); width: 100%; border-top: 1px solid rgba(241,196,15,0.3); }
        .status-text { text-align: center; margin-bottom: 6px; font-size: 12px; color: #f1c40f; font-weight: bold; }
        .hand-cards { display: flex; justify-content: center; gap: 5px; overflow-x: auto; padding: 6px 0; min-height: 85px; }

        /* نوافذ الحوار (الطلبات ونهاية الشوط) */
        #bid-modal, #round-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1b3b2b; padding: 25px; border-radius: 16px; z-index: 1000; box-shadow: 0 0 50px rgba(0,0,0,0.9); text-align: center; width: 90%; max-width: 380px; border: 2px solid #f1c40f; }
        #bid-modal h3, #round-modal h2 { color: #f1c40f; margin-bottom: 15px; font-size: 18px; }
        .bid-options-grid { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
        .bid-btn { background: #e67e22; color: #fff; padding: 10px 16px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: auto; min-width: 50px; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .bid-btn:hover { background: #d35400; }
        .next-round-btn { background: #27ae60; color: #fff; padding: 12px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 15px; }

        /* للشاشات الكبيرة (اللابتوب) */
        @media (min-width: 769px) {
            .table-area { width: 600px; height: 320px; border-width: 10px; border-radius: 120px; }
            .played-card { width: 48px; height: 70px; font-size: 13px; }
            .card { width: 56px; height: 82px; font-size: 14px; }
            .player-slot { font-size: 12px; min-width: 100px; padding: 8px 12px; }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-box">
        <div class="login-card">
            <h2>طرنيب ليبي أونلاين 🇱🇾</h2>
            <input type="text" id="username" placeholder="اسمك الكامل" value="عبد الله">
            <input type="text" id="room" placeholder="رمز الغرفة" value="tripoli">
            <button class="login-btn" onclick="joinGame()">دخول الغرفة</button>
        </div>
    </div>

    <!-- شاشة اللعبة -->
    <div id="game-board">
        <div class="top-bar">
            <div class="room-title">الغرفة: <span id="room-display"></span></div>
            <button id="start-btn" onclick="startGame()">بدء اللعبة (بوتات)</button>
        </div>

        <div class="scoreboard" id="scoreboard-list"></div>

        <div class="table-container">
            <div class="table-area">
                <div id="slot-0" class="player-slot p-0"></div>
                <div id="slot-1" class="player-slot p-1"></div>
                <div id="slot-2" class="player-slot p-2"></div>
                <div id="slot-3" class="player-slot p-3"></div>

                <div class="trick-center" id="trick-area">
                    <div id="winner-badge-area"></div>
                </div>
            </div>
        </div>

        <!-- نافذة اختيار الطلب -->
        <div id="bid-modal">
            <h3>اختر الطلبة (طلبك الإجباري):</h3>
            <div class="bid-options-grid" id="bid-options"></div>
        </div>

        <!-- نافذة نهاية الشوط -->
        <div id="round-modal">
            <h2 id="round-title">انتهى الشوط!</h2>
            <p id="round-desc" style="margin: 10px 0; font-size: 15px; line-height: 1.6;"></p>
            <button class="next-round-btn" onclick="nextRound()">الشوط التالي</button>
        </div>

        <!-- كروت يدي في الأسفل -->
        <div class="hand-container">
            <div class="status-text" id="status-msg">في انتظار بدء اللعبة...</div>
            <div class="hand-cards" id="my-hand"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let myIndex = 0;
        let currentRoom = "";
        const suitIcons = {'Hearts':'♥', 'Tiles':'♦', 'Clovers':'♣', 'Pikes':'♠'};

        function joinGame() {
            const name = document.getElementById('username').value;
            currentRoom = document.getElementById('room').value;
            if(!name || !currentRoom) return alert("اكتب اسمك ورمز الغرفة");

            socket.emit('join_game', {name: name, room: currentRoom});
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('game-board').style.display = 'flex';
            document.getElementById('room-display').innerText = currentRoom;
        }

        function startGame() {
            socket.emit('start_game', {room: currentRoom});
            document.getElementById('start-btn').style.display = 'none';
        }

        function nextRound() {
            document.getElementById('round-modal').style.display = 'none';
            socket.emit('next_round', {room: currentRoom});
        }

        socket.on('game_update', (data) => {
            myIndex = data.my_index;
            renderPlayers(data.players, data.current_turn);
            renderScoreboard(data.players);
            renderTrick(data.current_trick, data.last_winner);
            renderHand(data.my_hand);

            if(data.game_started) {
                document.getElementById('start-btn').style.display = 'none';
            }

            if(data.state === 'BIDDING' && data.current_turn === myIndex) {
                showBidModal(data.min_bid);
            } else {
                document.getElementById('bid-modal').style.display = 'none';
            }

            if(data.state === 'ROUND_OVER' || data.state === 'GAME_OVER') {
                const rModal = document.getElementById('round-modal');
                const rDesc = document.getElementById('round-desc');
                document.getElementById('round-title').innerText = data.state === 'GAME_OVER' ? '🏆 نهاية الجيم بالكامل!' : 'انتهى الشوط الحالي';
                
                let scoreText = data.winner_message ? data.winner_message + "<br><br>" : "";
                data.players.forEach(p => {
                    scoreText += `<b>${p.name}</b>: ${p.score} نقطة<br>`;
                });
                rDesc.innerHTML = scoreText;
                rModal.style.display = 'block';
            }

            if(data.state === 'BIDDING') {
                document.getElementById('status-msg').innerText = "مرحلة اختيار الطلبات...";
            } else if(data.state === 'PLAYING') {
                document.getElementById('status-msg').innerText = (data.current_turn === myIndex) ? "دورك للعب ورقة!" : "في انتظار باقي اللاعبين...";
            }
        });

        socket.on('error', (data) => alert(data.msg));

        function renderPlayers(players, turn) {
            players.forEach((p, idx) => {
                let UI_idx = (idx - myIndex + 4) % 4;
                let slot = document.getElementById(`slot-${UI_idx}`);
                slot.className = `player-slot p-${UI_idx} ${idx === turn ? 'active-turn' : ''}`;
                
                let backsHtml = '';
                if(UI_idx !== 0 && p.cards_count > 0) {
                    if(UI_idx === 1 || UI_idx === 3) {
                        backsHtml = '<div class="cards-back-vertical">';
                        for(let i=0; i<Math.min(p.cards_count, 13); i++) backsHtml += '<div class="card-back"></div>';
                        backsHtml += '</div>';
                    } else {
                        backsHtml = '<div class="cards-back-container">';
                        for(let i=0; i<Math.min(p.cards_count, 13); i++) backsHtml += '<div class="card-back"></div>';
                        backsHtml += '</div>';
                    }
                }

                slot.innerHTML = `<b>${p.name}</b><br>طلب: ${p.bid} | أكلات: ${p.tricks_won}${backsHtml}`;
            });
        }

        function renderScoreboard(players) {
            const list = document.getElementById('scoreboard-list');
            list.innerHTML = '';
            players.forEach(p => {
                let item = document.createElement('div');
                item.className = 'score-item';
                item.innerHTML = `<span>${p.name}:</span> <b>${p.score}</b>`;
                list.appendChild(item);
            });
        }

        function renderHand(hand) {
            const handDiv = document.getElementById('my-hand');
            handDiv.innerHTML = '';
            if(!hand) return;
            hand.forEach(card => {
                let cardEl = document.createElement('div');
                let isRed = card.suit === 'Hearts' || card.suit === 'Tiles';
                cardEl.className = `card ${isRed ? 'red' : 'black'}`;
                cardEl.innerHTML = `<div>${card.rank}</div><div>${suitIcons[card.suit]}</div>`;
                cardEl.onclick = () => socket.emit('play_card', {room: currentRoom, card: card});
                handDiv.appendChild(cardEl);
            });
        }

        function renderTrick(trick, lastWinner) {
            const area = document.getElementById('trick-area');
            const badgeArea = document.getElementById('winner-badge-area');
            
            area.querySelectorAll('.played-card').forEach(el => el.remove());
            badgeArea.innerHTML = '';

            if(lastWinner && (!trick || trick.length === 0)) {
                badgeArea.innerHTML = `<div class="trick-winner-badge">أكلها: ${lastWinner} 🏆</div>`;
            }

            if(!trick) return;
            trick.forEach(play => {
                let p_idx = play.player_idx;
                let UI_idx = (p_idx - myIndex + 4) % 4;
                let c = play.card;
                let isRed = c.suit === 'Hearts' || c.suit === 'Tiles';
                
                let cardEl = document.createElement('div');
                cardEl.className = `played-card card-pos-${UI_idx} ${isRed ? 'red' : 'black'}`;
                cardEl.innerHTML = `<div>${c.rank}</div><div>${suitIcons[c.suit]}</div>`;
                area.appendChild(cardEl);
            });
        }

        function showBidModal(minBid) {
            const modal = document.getElementById('bid-modal');
            const opts = document.getElementById('bid-options');
            opts.innerHTML = '';
            modal.style.display = 'block';

            let b0 = document.createElement('button');
            b0.className = 'bid-btn'; b0.innerText = '0';
            b0.onclick = () => submitBid(0);
            opts.appendChild(b0);

            for(let i = minBid; i <= 13; i++) {
                if(i === 6 || i === 8 || i === 10 || i === 11 || i === 12) continue;
                let b = document.createElement('button');
                b.className = 'bid-btn'; b.innerText = i;
                b.onclick = () => submitBid(i);
                opts.appendChild(b);
            }
        }

        function submitBid(val) {
            socket.emit('submit_bid', {room: currentRoom, bid: val});
            document.getElementById('bid-modal').style.display = 'none';
        }
    </script>
</body>
</html>
