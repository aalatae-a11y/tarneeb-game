<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>طرنيب ليبي أونلاين</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #1a1a1a; color: white; text-align: center; display: flex; flex-direction: column; min-height: 100vh; }
        #login-box { margin: auto; padding: 30px; background: #2c3e50; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.5); }
        input, button { padding: 12px 20px; font-size: 16px; margin: 10px; border-radius: 6px; border: none; }
        button { background: #27ae60; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #219150; }
        #game-board { display: none; flex-direction: column; flex: 1; position: relative; background: #0f522e; padding: 20px; }
        .table-area { position: relative; width: 100%; max-width: 800px; height: 450px; margin: 20px auto; border: 12px solid #5c3a21; border-radius: 150px; background: #136938; box-shadow: inset 0 0 50px rgba(0,0,0,0.6); }
        .player-slot { position: absolute; padding: 10px 15px; background: rgba(0,0,0,0.7); border-radius: 8px; font-size: 14px; min-width: 110px; }
        .p-0 { bottom: -20px; left: 50%; transform: translateX(-50%); border: 2px solid #f1c40f; }
        .p-1 { left: 10px; top: 50%; transform: translateY(-50%); }
        .p-2 { top: -20px; left: 50%; transform: translateX(-50%); }
        .p-3 { right: 10px; top: 50%; transform: translateY(-50%); }
        .active-turn { box-shadow: 0 0 15px #f1c40f; border-color: #f1c40f; }
        .trick-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; gap: 10px; }
        .hand-cards { display: flex; justify-content: center; gap: -20px; margin-top: auto; padding: 10px; overflow-x: auto; }
        .card { width: 65px; height: 95px; background: white; color: black; border-radius: 6px; display: flex; flex-direction: column; justify-content: space-between; padding: 5px; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 2px 2px 8px rgba(0,0,0,0.4); transition: transform 0.2s; user-select: none; }
        .card:hover { transform: translateY(-15px); }
        .card.red { color: #e74c3c; }
        .card.black { color: #2c3e50; }
        #bid-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #34495e; padding: 25px; border-radius: 10px; z-index: 100; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .bid-btn { background: #e67e22; padding: 10px 15px; margin: 5px; }
    </style>
</head>
<body>

    <div id="login-box">
        <h2>طرنيب ليبي أونلاين 🇱🇾</h2>
        <br>
        <input type="text" id="username" placeholder="اسمك الكامل" value="عبد الله">
        <input type="text" id="room" placeholder="رمز الغرفة" value="tripoli">
        <br>
        <button onclick="joinGame()">دخول الغرفة</button>
    </div>

    <div id="game-board">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>الغرفة: <span id="room-display"></span></h3>
            <button id="start-btn" onclick="startGame()">بدء اللعبة (إكمال بالبوتات)</button>
        </div>

        <div class="table-area">
            <div id="slot-0" class="player-slot p-0">لاعب 1</div>
            <div id="slot-1" class="player-slot p-1">لاعب 2</div>
            <div id="slot-2" class="player-slot p-2">لاعب 3</div>
            <div id="slot-3" class="player-slot p-3">لاعب 4</div>

            <div class="trick-center" id="trick-area"></div>
        </div>

        <div id="bid-modal">
            <h3>اختر الطلبة (طلبك الإجباري):</h3>
            <div id="bid-options"></div>
        </div>

        <h4 id="status-msg" style="margin-bottom: 10px; color: #f1c40f;">في انتظار بدء اللعبة...</h4>
        <div class="hand-cards" id="my-hand"></div>
    </div>

    <script>
        const socket = io();
        let myIndex = 0;
        let currentRoom = "";

        const suitIcons = {'Hearts':'♥', 'Tiles':'♦', 'Clovers':'♣', 'Pikes':'♠'};

        function joinGame() {
            const name = document.getElementById('username').value;
            currentRoom = document.getElementById('room').value;
            if(!name || !currentRoom) return alert("اكتب اسمك ورمز الغرفة");

            socket.emit('join_game', {name: name, room: currentRoom});
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('game-board').style.display = 'flex';
            document.getElementById('room-display').innerText = currentRoom;
        }

        function startGame() {
            socket.emit('start_game', {room: currentRoom});
            document.getElementById('start-btn').style.display = 'none';
        }

        socket.on('update_room', (data) => {
            renderPlayers(data.players, -1);
        });

        socket.on('game_update', (data) => {
            myIndex = data.my_index;
            renderPlayers(data.players, data.current_turn);
            renderTrick(data.current_trick);
            renderHand(data.my_hand);

            // إظهار نافذة الطلب عند دورك
            if(data.state === 'BIDDING' && data.current_turn === myIndex) {
                showBidModal(data.min_bid);
            } else {
                document.getElementById('bid-modal').style.display = 'none';
            }

            // حالة السير
            if(data.state === 'BIDDING') {
                document.getElementById('status-msg').innerText = "مرحلة اختيار الطلبات...";
            } else if(data.state === 'PLAYING') {
                document.getElementById('status-msg').innerText = (data.current_turn === myIndex) ? "دورك للعب ورقة!" : "في انتظار باقي اللاعبين...";
            }
        });

        socket.on('error', (data) => alert(data.msg));

        function renderPlayers(players, turn) {
            players.forEach((p, idx) => {
                // تدوير المقاعد ليصبح اللاعب دائمًا في الأسفل
                let UI_idx = (idx - myIndex + 4) % 4;
                let slot = document.getElementById(`slot-${UI_idx}`);
                slot.className = `player-slot p-${UI_idx} ${idx === turn ? 'active-turn' : ''}`;
                slot.innerHTML = `<b>${p.name}</b> ${p.is_bot ? '(بوت)' : ''}<br>النقاط: ${p.score}<br>الطلب: ${p.bid} | الأكلات: ${p.tricks_won}`;
            });
        }

        function renderHand(hand) {
            const handDiv = document.getElementById('my-hand');
            handDiv.innerHTML = '';
            if(!hand) return;
            hand.forEach(card => {
                let cardEl = document.createElement('div');
                let isRed = card.suit === 'Hearts' || card.suit === 'Tiles';
                cardEl.className = `card ${isRed ? 'red' : 'black'}`;
                cardEl.innerHTML = `<div>${card.rank}</div><div>${suitIcons[card.suit]}</div>`;
                cardEl.onclick = () => socket.emit('play_card', {room: currentRoom, card: card});
                handDiv.appendChild(cardEl);
            });
        }

        function renderTrick(trick) {
            const area = document.getElementById('trick-area');
            area.innerHTML = '';
            if(!trick) return;
            trick.forEach(play => {
                let c = play.card;
                let isRed = c.suit === 'Hearts' || c.suit === 'Tiles';
                let cardEl = document.createElement('div');
                cardEl.className = `card ${isRed ? 'red' : 'black'}`;
                cardEl.innerHTML = `<div>${c.rank}</div><div>${suitIcons[c.suit]}</div>`;
                area.appendChild(cardEl);
            });
        }

        function showBidModal(minBid) {
            const modal = document.getElementById('bid-modal');
            const opts = document.getElementById('bid-options');
            opts.innerHTML = '';
            modal.style.display = 'block';

            // زر 0
            let b0 = document.createElement('button');
            b0.className = 'bid-btn'; b0.innerText = '0';
            b0.onclick = () => submitBid(0);
            opts.appendChild(b0);

            // أزرار الطلب بناءً على الحد الأدنى
            for(let i = minBid; i <= 13; i++) {
                if(i === 6 || i === 8 || i === 10 || i === 11 || i === 12) continue; // أرقام غير مطبقة بالطرنيب
                let b = document.createElement('button');
                b.className = 'bid-btn'; b.innerText = i;
                b.onclick = () => submitBid(i);
                opts.appendChild(b);
            }
        }

        function submitBid(val) {
            socket.emit('submit_bid', {room: currentRoom, bid: val});
            document.getElementById('bid-modal').style.display = 'none';
        }
    </script>
</body>
</html>
