<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة طرنيب ليبية أونلاين</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body class="bg-emerald-900 text-white font-sans min-h-screen flex flex-col items-center justify-between p-4">

    <!-- شاشة الدخول -->
    <div id="login-screen" class="bg-emerald-800 p-6 rounded-2xl shadow-2xl w-full max-w-md text-center mt-20 border border-emerald-600">
        <h1 class="text-3xl font-bold mb-6 text-yellow-300">لعبة طرنيب ليبية</h1>
        <input type="text" id="player-name" placeholder="أدخل اسمك الكريم..." class="w-full p-3 mb-4 rounded-xl bg-emerald-900 border border-emerald-500 text-white text-center focus:outline-none">
        <input type="text" id="room-name" placeholder="اسم الغرفة (مثال: libya123)" class="w-full p-3 mb-6 rounded-xl bg-emerald-900 border border-emerald-500 text-white text-center focus:outline-none">
        <button onclick="joinGame()" class="w-full bg-yellow-500 hover:bg-yellow-600 text-emerald-950 font-bold p-3 rounded-xl shadow-lg transition duration-200">دخول الطاولة</button>
    </div>

    <!-- شاشة اللعب الرئيسية -->
    <div id="game-screen" class="hidden w-full max-w-4xl flex flex-col justify-between h-screen py-2">
        <div class="flex justify-between items-center bg-emerald-950/60 p-3 rounded-xl border border-emerald-700">
            <div>الغرفة: <span id="room-display" class="font-bold text-yellow-300"></span></div>
            <div>الحالة: <span id="game-status-text" class="text-yellow-400">في انتظار اللاعبين...</span></div>
            <button onclick="fillBots()" id="start-btn" class="bg-blue-600 hover:bg-blue-700 px-4 py-1 rounded-lg text-sm font-bold">بدء اللعبة (إضافة بوتات)</button>
        </div>

        <div class="relative flex-grow flex items-center justify-center my-4">
            <div id="players-list" class="absolute inset-0 flex justify-between items-center pointer-events-none px-4"></div>
            <div id="trick-container" class="bg-emerald-950/80 border-2 border-dashed border-emerald-600 w-72 h-72 rounded-3xl flex flex-wrap items-center justify-center gap-2 relative shadow-inner p-2">
                <span class="text-emerald-400 text-xs absolute top-2">ساحة اللعب</span>
            </div>
        </div>

        <!-- لوحة الطلبات -->
        <div id="bidding-panel" class="hidden absolute inset-0 bg-black/70 flex items-center justify-center z-50">
            <div class="bg-emerald-800 p-6 rounded-2xl text-center border border-emerald-600 shadow-2xl">
                <h3 class="text-xl font-bold mb-4 text-yellow-300">اختر طلبك (عدد الأكلات)</h3>
                <div class="grid grid-cols-4 gap-2 mb-4">
                    <button onclick="submitBid(2)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">2</button>
                    <button onclick="submitBid(3)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">3</button>
                    <button onclick="submitBid(4)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">4</button>
                    <button onclick="submitBid(5)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">5</button>
                    <button onclick="submitBid(7)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">7 (14ن)</button>
                    <button onclick="submitBid(9)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">9 (21ن)</button>
                    <button onclick="submitBid(13)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">كبوت (13)</button>
                    <button onclick="submitBid(0)" class="bg-emerald-700 hover:bg-emerald-600 p-3 rounded-xl font-bold">صلاح (0)</button>
                </div>
            </div>
        </div>

        <!-- يد اللاعب -->
        <div class="bg-emerald-950 p-4 rounded-2xl border border-emerald-700 flex flex-col items-center">
            <div class="text-sm mb-2 text-yellow-300 font-semibold">أوراقك في اليد:</div>
            <div id="player-hand" class="flex gap-2 overflow-x-auto py-2 max-w-full"></div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoom = '';

        const suitSymbols = { 'hearts': '♥', 'spades': '♠', 'diamonds': '♦', 'clubs': '♣' };
        const suitColors = { 'hearts': 'text-red-500', 'diamonds': 'text-red-500', 'spades': 'text-black', 'clubs': 'text-black' };
        const valNames = { 11: 'J', 12: 'Q', 13: 'K', 14: 'A' };

        function joinGame() {
            const name = document.getElementById('player-name').value.trim();
            const room = document.getElementById('room-name').value.trim();
            if(!name || !room) { alert('الرجاء إدخال الاسم واسم الغرفة'); return; }
            currentRoom = room;
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('room-display').innerText = room;
            socket.emit('join_game', { name, room });
        }

        function fillBots() {
            socket.emit('start_game', { room: currentRoom });
        }

        function submitBid(bid) {
            socket.emit('submit_bid', { room: currentRoom, bid });
            document.getElementById('bidding-panel').classList.add('hidden');
        }

        function playCard(card) {
            socket.emit('play_card', { room: currentRoom, card });
        }

        socket.on('game_update', (state) => {
            if(state.status === 'bidding') {
                document.getElementById('game-status-text').innerText = 'مرحلة الطلب...';
                document.getElementById('bidding-panel').classList.remove('hidden');
            } else if(state.status === 'playing') {
                document.getElementById('game-status-text').innerText = 'الدور للعب الأوراق';
                document.getElementById('bidding-panel').classList.add('hidden');
                document.getElementById('start-btn').classList.add('hidden');
            } else if(state.status === 'ended') {
                document.getElementById('game-status-text').innerText = 'انتهت اللعبة!';
            }

            // عرض اللاعبين
            const listDiv = document.getElementById('players-list');
            listDiv.innerHTML = '';
            state.players.forEach((p, idx) => {
                const pBox = document.createElement('div');
                pBox.className = `p-3 rounded-xl bg-emerald-950/90 border ${idx === state.current_turn ? 'border-yellow-400 shadow-lg shadow-yellow-500/20' : 'border-emerald-700'} text-center text-xs`;
                pBox.innerHTML = `<div class="font-bold text-yellow-300">${p.name}</div><div>النقاط: ${p.score}</div><div>الكروت: ${p.cards_count}</div>`;
                listDiv.appendChild(pBox);
            });

            // عرض الأوراق المطروحة في الساحة
            const trickDiv = document.getElementById('trick-container');
            trickDiv.innerHTML = '<span class="text-emerald-400 text-xs absolute top-2">ساحة اللعب</span>';
            state.trick.forEach(t => {
                const cardEl = document.createElement('div');
                const vDisplay = valNames[t.card.val] || t.card.val;
                cardEl.className = `bg-white ${suitColors[t.card.suit]} w-12 h-16 rounded-lg flex flex-col items-center justify-center font-bold text-lg shadow-md border border-gray-300 mt-4`;
                cardEl.innerHTML = `<span>${vDisplay}</span><span class="text-sm">${suitSymbols[t.card.suit]}</span>`;
                trickDiv.appendChild(cardEl);
            });

            // عرض يد اللاعب الخاصة به
            const handDiv = document.getElementById('player-hand');
            handDiv.innerHTML = '';
            if(state.my_hand) {
                state.my_hand.forEach(card => {
                    const cardBtn = document.createElement('button');
                    const vDisplay = valNames[card.val] || card.val;
                    cardBtn.className = `bg-white ${suitColors[card.suit]} w-14 h-20 rounded-xl flex flex-col items-center justify-center font-bold text-xl shadow-lg border-2 border-gray-200 hover:scale-105 transition transform`;
                    cardBtn.innerHTML = `<span>${vDisplay}</span><span class="text-lg">${suitSymbols[card.suit]}</span>`;
                    cardBtn.onclick = () => playCard(card);
                    handDiv.appendChild(cardBtn);
                });
            }
        });
    </script>
</body>
</html>
