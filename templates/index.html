<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>طرنيب ليبي أونلاين</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: #1c1c1e; color: white; height: 100dvh; width: 100vw; overflow: hidden; display: flex; justify-content: center; align-items: center; }

        #login-box { padding: 25px; background: #2c2c2e; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); text-align: right; width: 90%; max-width: 350px; z-index: 100; border: 1px solid #3a3a3c; }
        #login-box h2 { text-align: center; margin-bottom: 20px; color: #34c759; font-size: 22px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 13px; margin-bottom: 6px; color: #8e8e93; }
        input { padding: 12px; font-size: 15px; border-radius: 10px; border: 1px solid #3a3a3c; width: 100%; background: #1c1c1e; color: white; }
        button.login-btn { padding: 14px; font-size: 16px; border-radius: 10px; border: none; width: 100%; background: #34c759; color: white; cursor: pointer; font-weight: bold; margin-top: 10px; }

        #game-board { display: none; width: 100vw; height: 100dvh; position: relative; background: #1c1c1e; flex-direction: column; justify-content: space-between; align-items: center; overflow: hidden; padding-bottom: 5px; }

        .header-bar { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 10px 15px; z-index: 20; }
        .header-icons { display: flex; gap: 12px; align-items: center; }
        .icon-btn { font-size: 18px; color: #8e8e93; cursor: pointer; }

        .cross-score { position: absolute; top: 48px; left: 15px; background: rgba(0,0,0,0.85); border-radius: 8px; padding: 6px; display: grid; grid-template-columns: repeat(3, 20px); grid-template-rows: repeat(3, 20px); gap: 2px; text-align: center; font-size: 10px; font-weight: bold; z-index: 15; border: 1px solid #333; }
        .cross-score div { display: flex; justify-content: center; align-items: center; }

        .last-trick-box { position: absolute; top: 48px; right: 15px; background: rgba(0,0,0,0.85); border: 1px solid #444; border-radius: 8px; padding: 5px; width: 65px; height: 65px; z-index: 15; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .last-trick-title { font-size: 8px; color: #aaa; margin-bottom: 2px; }
        .mini-cards-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 2px; }
        .mini-card { width: 22px; height: 30px; background: white; border-radius: 2px; font-size: 8px; font-weight: bold; display: flex; justify-content: center; align-items: center; }
        .mini-card.red { color: #d03b29; }
        .mini-card.black { color: #000; }

        .table-container { position: relative; width: 90%; height: 50dvh; margin-top: 5px; border: 6px solid #d1d1d6; border-radius: 32px; background: #24a148; box-shadow: inset 0 0 25px rgba(0,0,0,0.7); flex-shrink: 0; }

        .player-node { position: absolute; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .node-top { top: -38px; left: 50%; transform: translateX(-50%); }
        .node-left { left: -32px; top: 40%; transform: translateY(-50%); }
        .node-right { right: -32px; top: 40%; transform: translateY(-50%); }

        .avatar-container { position: relative; display: flex; align-items: center; }
        .avatar-circle { width: 52px; height: 52px; border-radius: 50%; background: #636366; border: 3px solid #ffcc00; display: flex; justify-content: center; align-items: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        
        .won-pile { position: absolute; width: 26px; height: 36px; background: #c72c2c; border: 1px solid #fff; border-radius: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); display: none; }
        .node-top .won-pile { right: -32px; top: 10px; }
        .node-left .won-pile { right: -32px; top: 10px; }
        .node-right .won-pile { left: -32px; top: 10px; }
        .bottom-won-pile { position: absolute; left: -35px; top: 5px; width: 26px; height: 36px; background: #c72c2c; border: 1px solid #fff; border-radius: 4px; display: none; }

        .fan-cards { position: absolute; top: -14px; width: 50px; height: 25px; z-index: -1; }
        .fan-card-back { position: absolute; width: 12px; height: 20px; background: #c72c2c; border: 1px solid #fff; border-radius: 2px; transform-origin: bottom center; }

        .player-name { font-size: 10px; background: rgba(0,0,0,0.85); padding: 2px 8px; border-radius: 10px; margin-top: 2px; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border: 1px solid #444; }
        .bid-badge { font-size: 10px; background: #000; color: #fff; padding: 2px 8px; border-radius: 4px; font-weight: bold; margin-top: 2px; border: 1px solid #444; }

        .center-trick { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 120px; height: 120px; z-index: 5; }
        .played-card { position: absolute; width: 42px; height: 58px; background: white; border-radius: 5px; border: 1px solid #ccc; display: flex; flex-direction: column; justify-content: space-between; padding: 3px; font-weight: bold; font-size: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.4); }
        .played-card.red { color: #d03b29; }
        .played-card.black { color: #1c1c1e; }

        .pos-0 { bottom: 0; left: 50%; transform: translateX(-50%); }
        .pos-1 { left: 0; top: 50%; transform: translateY(-50%); }
        .pos-2 { top: 0; left: 50%; transform: translateX(-50%); }
        .pos-3 { right: 0; top: 50%; transform: translateY(-50%); }

        .bottom-section { width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 20; padding-bottom: 5px; }
        .hand-cards-container { display: flex; justify-content: center; width: 98%; padding: 4px 0; overflow-x: auto; min-height: 80px; }
        
        .hand-card { width: 46px; height: 68px; background: white; border-radius: 6px; border: 1px solid #bbb; margin-left: -12px; display: flex; flex-direction: column; justify-content: space-between; padding: 4px; font-weight: bold; font-size: 13px; box-shadow: -2px 0 6px rgba(0,0,0,0.3); cursor: pointer; transition: transform 0.1s ease; flex-shrink: 0; position: relative; z-index: 100; pointer-events: auto; }
        .hand-card:first-child { margin-left: 0; }
        .hand-card:hover { transform: translateY(-12px); border-color: #34c759; z-index: 105; }
        .hand-card.red { color: #d03b29; }
        .hand-card.black { color: #1c1c1e; }

        .bottom-info { width: 92%; display: flex; justify-content: space-between; align-items: center; margin-top: 4px; }
        .tricks-box { background: #000; padding: 6px 14px; border-radius: 8px; font-size: 11px; display: flex; gap: 10px; border: 1px solid #333; }

        #bid-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2c2c2e; padding: 15px; border-radius: 16px; z-index: 100; border: 1px solid #3a3a3c; width: 240px; text-align: center; }
        #bid-modal h3 { font-size: 14px; margin-bottom: 12px; color: white; }
        .bid-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .bid-btn { background: #ffcc00; color: #000; border: none; border-radius: 8px; padding: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }

        #round-modal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #2c2c2e; padding: 20px; border-radius: 16px; z-index: 100; border: 1px solid #3a3a3c; text-align: center; width: 260px; }
    </style>
</head>
<body>

    <div id="login-box">
        <h2>طرنيب ليبي 🇱🇾</h2>
        <div class="input-group">
            <label>اسم اللاعب:</label>
            <input type="text" id="username" placeholder="مثال: عبد الله">
        </div>
        <div class="input-group">
            <label>رمز الغرفة:</label>
            <input type="text" id="room" placeholder="مثال: tripoli">
        </div>
        <button class="login-btn" onclick="joinGame()">دخول اللعبة</button>
    </div>

    <div id="game-board">
        <div class="header-bar">
            <div class="header-icons">
                <span class="icon-btn">💬</span>
                <span class="icon-btn">👤+</span>
            </div>
            <div style="font-weight: bold; font-size: 14px;" id="room-display">400</div>
            <div class="header-icons">
                <span class="icon-btn">📻</span>
                <span class="icon-btn">☰</span>
            </div>
        </div>

        <div class="cross-score">
            <div></div><div id="score-top">0</div><div></div>
            <div id="score-left">0</div><div style="color:#ffcc00">41</div><div id="score-right">0</div>
            <div></div><div id="score-bottom">0</div><div></div>
        </div>

        <div class="last-trick-box">
            <div class="last-trick-title">آخر أكلة</div>
            <div class="mini-cards-grid" id="last-trick-cards">
                <div style="font-size:8px; color:#777; grid-column: span 2; text-align:center;">لا توجد</div>
            </div>
        </div>

        <div class="table-container">
            <div class="player-node node-top">
                <div class="fan-cards">
                    <div class="fan-card-back" style="transform: rotate(-15deg);"></div>
                    <div class="fan-card-back" style="transform: rotate(0deg);"></div>
                    <div class="fan-card-back" style="transform: rotate(15deg);"></div>
                </div>
                <div class="avatar-container">
                    <div class="avatar-circle" id="avatar-2">👤</div>
                    <div class="won-pile" id="pile-2"></div>
                </div>
                <div class="player-name" id="name-2">لاعب 2</div>
                <div class="bid-badge" id="bid-2">2 / 0</div>
            </div>

            <div class="player-node node-left">
                <div class="avatar-container">
                    <div class="avatar-circle" id="avatar-1">👤</div>
                    <div class="won-pile" id="pile-1"></div>
                </div>
                <div class="player-name" id="name-1">لاعب 1</div>
                <div class="bid-badge" id="bid-1">2 / 0</div>
            </div>

            <div class="player-node node-right">
                <div class="avatar-container">
                    <div class="avatar-circle" id="avatar-3">👤</div>
                    <div class="won-pile" id="pile-3"></div>
                </div>
                <div class="player-name" id="name-3">لاعب 3</div>
                <div class="bid-badge" id="bid-3">2 / 0</div>
            </div>

            <div class="center-trick" id="trick-area"></div>
        </div>

        <div class="bottom-section">
            <div class="hand-cards-container" id="my-hand"></div>
            <div class="bottom-info">
                <div class="tricks-box">
                    <span>أكلات</span>
                    <span id="my-tricks-count" style="color:#ffcc00; font-weight:bold;">0 / 5</span>
                </div>
                <div style="display:flex; align-items:center; gap:8px; position:relative;">
                    <div class="won-pile bottom-won-pile" id="pile-0"></div>
                    <div class="player-name" id="name-0" style="background:none; border:none;">أنت</div>
                    <div class="avatar-circle" style="width:42px; height:42px;" id="avatar-0">👤</div>
                </div>
            </div>
        </div>

        <div id="bid-modal">
            <h3>اختر الطلبة</h3>
            <div class="bid-grid" id="bid-options"></div>
        </div>

        <div id="round-modal">
            <h3 id="round-title" style="color:#34c759; margin-bottom:10px;">انتهى الشوط</h3>
            <p id="round-desc" style="font-size:12px; margin-bottom:15px;"></p>
            <button onclick="nextRound()" style="background:#34c759; border:none; padding:8px 16px; color:white; border-radius:8px; font-weight:bold;">متابعة</button>
        </div>
    </div>

    <script>
        const socket = io({ 
            transports: ['websocket', 'polling'],
            reconnection: true,
            reconnectionAttempts: Infinity,
            reconnectionDelay: 1000
        });

        let myIndex = 0;
        let currentRoom = "";
        let currentTurnGlobal = -1;
        const suitIcons = {'Hearts':'♥', 'Tiles':'♦', 'Clovers':'♣', 'Pikes':'♠'};

        function joinGame() {
            const name = document.getElementById('username').value.trim();
            currentRoom = document.getElementById('room').value.trim();
            if(!name || !currentRoom) return alert("يرجى كتابة الاسم ورمز الغرفة");

            socket.emit('join_game', {name: name, room: currentRoom});
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('game-board').style.display = 'flex';
            document.getElementById('room-display').innerText = currentRoom;

            setTimeout(() => {
                socket.emit('start_game', {room: currentRoom});
            }, 400);
        }

        socket.on('connect', () => {
            if (currentRoom) {
                const name = document.getElementById('username').value.trim();
                if(name) socket.emit('join_game', {name: name, room: currentRoom});
            }
        });

        function nextRound() {
            document.getElementById('round-modal').style.display = 'none';
            socket.emit('next_round', {room: currentRoom});
        }

        socket.on('game_update', (data) => {
            myIndex = data.my_index;
            currentTurnGlobal = data.current_turn;

            renderPlayers(data.players, data.current_turn);
            renderTrick(data.current_trick);
            renderLastTrick(data.last_trick);
            renderHand(data.my_hand, data.current_turn === myIndex);

            if(data.state === 'BIDDING' && data.current_turn === myIndex) {
                showBidModal(data.min_bid);
            } else {
                document.getElementById('bid-modal').style.display = 'none';
            }

            if(data.state === 'ROUND_OVER' || data.state === 'GAME_OVER') {
                const rModal = document.getElementById('round-modal');
                const rDesc = document.getElementById('round-desc');
                let scoreText = data.winner_message ? data.winner_message + "<br><br>" : "";
                data.players.forEach(p => { scoreText += `${p.name}: ${p.score} نقطة<br>`; });
                rDesc.innerHTML = scoreText;
                rModal.style.display = 'block';
            }
        });

        socket.on('error', (data) => alert(data.msg));

        function renderPlayers(players, turn) {
            players.forEach((p, idx) => {
                let UI_idx = (idx - myIndex + 4) % 4;
                
                const nameEl = document.getElementById(`name-${UI_idx}`);
                const bidEl = document.getElementById(`bid-${UI_idx}`);
                const avatarEl = document.getElementById(`avatar-${UI_idx}`);
                const pileEl = document.getElementById(`pile-${UI_idx}`);

                if(nameEl) nameEl.innerText = p.name;
                if(bidEl) bidEl.innerText = `${p.tricks_won} / ${p.bid}`;

                if(UI_idx === 0) {
                    document.getElementById('my-tricks-count').innerText = `${p.tricks_won} / ${p.bid}`;
                }

                if(pileEl) {
                    if(p.won_cards_count > 0) {
                        pileEl.style.display = 'block';
                    } else {
                        pileEl.style.display = 'none';
                    }
                }

                if(avatarEl) {
                    if(idx === turn) {
                        avatarEl.style.borderColor = '#34c759';
                        avatarEl.style.boxShadow = '0 0 10px #34c759';
                    } else {
                        avatarEl.style.borderColor = '#ffcc00';
                        avatarEl.style.boxShadow = 'none';
                    }
                }
            });
        }

        function renderHand(hand, isMyTurn) {
            const handDiv = document.getElementById('my-hand');
            if(!handDiv) return;
            handDiv.innerHTML = '';
            if(!hand) return;

            hand.forEach(card => {
                let cardEl = document.createElement('div');
                let isRed = card.suit === 'Hearts' || card.suit === 'Tiles';
                cardEl.className = `hand-card ${isRed ? 'red' : 'black'}`;
                cardEl.innerHTML = `<div>${card.rank}</div><div style="text-align:center;">${suitIcons[card.suit]}</div>`;
                
                cardEl.onclick = (e) => {
                    e.preventDefault();
                    if (currentTurnGlobal !== myIndex) {
                        alert("ليس دورك الآن!");
                        return;
                    }
                    socket.emit('play_card', {room: currentRoom, card: card});
                };

                handDiv.appendChild(cardEl);
            });
        }

        function renderTrick(trick) {
            const area = document.getElementById('trick-area');
            if(!area) return;
            area.innerHTML = '';

            if(!trick) return;
            trick.forEach(play => {
                let UI_idx = (play.player_idx - myIndex + 4) % 4;
                let c = play.card;
                let isRed = c.suit === 'Hearts' || c.suit === 'Tiles';

                let cardEl = document.createElement('div');
                cardEl.className = `played-card pos-${UI_idx} ${isRed ? 'red' : 'black'}`;
                cardEl.innerHTML = `<div>${c.rank}</div><div style="text-align:center;">${suitIcons[c.suit]}</div>`;
                area.appendChild(cardEl);
            });
        }

        function renderLastTrick(lastTrick) {
            const container = document.getElementById('last-trick-cards');
            if(!container) return;
            container.innerHTML = '';

            if(!lastTrick || lastTrick.length === 0) {
                container.innerHTML = `<div style="font-size:8px; color:#777; grid-column: span 2; text-align:center;">لا توجد</div>`;
                return;
            }

            lastTrick.forEach(play => {
                let c = play.card;
                let isRed = c.suit === 'Hearts' || c.suit === 'Tiles';
                let miniCard = document.createElement('div');
                miniCard.className = `mini-card ${isRed ? 'red' : 'black'}`;
                miniCard.innerText = `${c.rank}${suitIcons[c.suit]}`;
                container.appendChild(miniCard);
            });
        }

        function showBidModal(minBid) {
            const modal = document.getElementById('bid-modal');
            const opts = document.getElementById('bid-options');
            if(!modal || !opts) return;
            opts.innerHTML = '';
            modal.style.display = 'block';

            let b0 = document.createElement('button');
            b0.className = 'bid-btn'; b0.innerText = '0';
            b0.onclick = () => submitBid(0);
            opts.appendChild(b0);

            let startBid = (minBid > 2) ? minBid : 2;
            for(let i = startBid; i <= 13; i++) {
                if(i === 6 || i === 8 || i === 10 || i === 11 || i === 12) continue;
                let b = document.createElement('button');
                b.className = 'bid-btn'; b.innerText = i;
                b.onclick = () => submitBid(i);
                opts.appendChild(b);
            }
        }

        function submitBid(val) {
            socket.emit('submit_bid', {room: currentRoom, bid: val});
            document.getElementById('bid-modal').style.display = 'none';
        }
    </script>
</body>
</html>
